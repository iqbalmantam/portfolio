<title>Contoh Simulasi Gudang Live · Dock dan Truk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Peta isometrik gudang memenuhi layar; panel melayang di sudut-sudut kosong peta. Di ponsel panel menumpuk di bawah peta. */
:root{
  --font-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#e7ebef; --panel:#ffffff; --panel-2:#f2f5f8; --line:#d9dfe6; --fg:#14202c; --muted:#617080;
  --accent:#1b5fd4; --accent-soft:#e2ebfb;
  --ok:#13885a; --ok-soft:#d9f2e6; --warn:#a96a00; --warn-soft:#fbeed0; --crit:#cf3e38; --crit-soft:#fbe2e0;
  --shadow:0 8px 28px rgba(16,28,44,.12);
  --s-ground:#d2dccd; --s-edge:#b1bcb0; --s-apron:#e7e6e0; --s-road:#98a1ab; --s-mark:#f1f4f7; --s-fence:#8b96a3;
  --s-wall:#f5f7f9; --s-clad:#c9d3c8; --s-roof:#7ea6d4; --s-solar:#2a5cab; --s-door:#5d6977; --s-trunk:#7a6a58; --s-tree:#68a37a;
  --s-shade:rgba(15,25,40,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1218; --panel:#151c24; --panel-2:#1c242e; --line:#2a3440; --fg:#e5eaf0; --muted:#8a98a8;
    --accent:#5c9cff; --accent-soft:#182b4a;
    --ok:#3ccb8c; --ok-soft:#12362a; --warn:#e8ab3c; --warn-soft:#3a2d10; --crit:#ff6f68; --crit-soft:#3e1b1a;
    --shadow:0 8px 28px rgba(0,0,0,.45);
    --s-ground:#16211b; --s-edge:#0b100d; --s-apron:#27303a; --s-road:#2a323d; --s-mark:#667587; --s-fence:#6f8197;
    --s-wall:#566370; --s-clad:#47564d; --s-roof:#41689a; --s-solar:#1f4a8a; --s-door:#0e141b; --s-trunk:#4a4034; --s-tree:#3b6a50;
    --s-shade:rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1218; --panel:#151c24; --panel-2:#1c242e; --line:#2a3440; --fg:#e5eaf0; --muted:#8a98a8;
  --accent:#5c9cff; --accent-soft:#182b4a;
  --ok:#3ccb8c; --ok-soft:#12362a; --warn:#e8ab3c; --warn-soft:#3a2d10; --crit:#ff6f68; --crit-soft:#3e1b1a;
  --shadow:0 8px 28px rgba(0,0,0,.45);
  --s-ground:#16211b; --s-edge:#0b100d; --s-apron:#27303a; --s-road:#2a323d; --s-mark:#667587; --s-fence:#6f8197;
  --s-wall:#566370; --s-clad:#47564d; --s-roof:#41689a; --s-solar:#1f4a8a; --s-door:#0e141b; --s-trunk:#4a4034; --s-tree:#3b6a50;
  --s-shade:rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--font-ui);display:flex;flex-direction:column;overflow:hidden}
.mono{font-family:var(--font-mono)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Bilah atas */
.top{position:relative;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.demo{font:600 10px var(--font-ui);letter-spacing:.04em;text-transform:none;color:var(--warn);background:var(--warn-soft);padding:2px 7px;border-radius:99px}
.search{position:relative;flex:1 1 280px;max-width:520px;margin-inline:auto}
.search svg{position:absolute;left:11px;top:50%;translate:0 -50%;color:var(--muted)}
.search input{width:100%;height:38px;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:0 12px 0 34px;color:var(--fg);font:inherit}
.search input::placeholder{color:var(--muted)}
.fac{position:relative}
.facbtn{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px 0 8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;cursor:pointer;text-align:left}
.facbtn:hover{background:var(--panel-2)}
.fmark{display:grid;place-items:center;height:26px;padding:0 7px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600}
.fnames{display:grid;line-height:1.2}
.fnames b{font-size:13px;font-weight:700}
.fnames small{color:var(--muted);font-size:11px}
.facmenu{position:absolute;right:0;top:calc(100% + 8px);width:min(380px,calc(100vw - 32px));padding:6px 0;z-index:40}
.fmhead{display:flex;justify-content:space-between;padding:8px 14px 6px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fm{display:grid;grid-template-columns:auto 1fr 64px;gap:12px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:9px 14px;cursor:pointer;border-top:1px solid var(--line)}
.fm:hover{background:var(--panel-2)}
.fm.on{background:var(--accent-soft)}
.fm .fc{font:600 10px var(--font-mono);color:var(--muted);background:var(--panel-2);padding:3px 6px;border-radius:5px}
.fm .fi{display:grid;gap:1px;min-width:0}
.fm .fi b{font-size:12.5px;font-weight:700}
.fm .fi small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm .fu{display:grid;gap:4px;justify-items:end;font:600 11px var(--font-mono)}
.fm .fu i{display:block;width:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.fm .fu i::after{content:"";display:block;height:100%;width:var(--w);background:var(--accent)}
.fm .fu.hi i::after{background:var(--warn)}
.live{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--line);background:var(--ok-soft);color:var(--ok);border-radius:99px;cursor:pointer;font-weight:700;font-size:12px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.8s ease-in-out infinite}
.live time{font-weight:600;font-size:12px}
.live[aria-pressed="true"]{background:var(--panel-2);color:var(--muted)}
.live[aria-pressed="true"] i{background:var(--muted);animation:none}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}

/* Panggung */
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
.view{position:absolute;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
canvas:active{cursor:grabbing}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.ctrl{position:absolute;right:16px;top:16px;display:grid;gap:6px;z-index:6}
.ctrl button{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);background:var(--panel);border-radius:10px;cursor:pointer;box-shadow:var(--shadow)}
.ctrl button:hover{background:var(--panel-2)}
.ctrl{justify-items:end}
.ctrl button.txt{width:auto;padding:0 12px;font-weight:700;font-size:12px}
.ctrl button.txt[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

.kpis{position:absolute;top:16px;left:16px;display:flex;gap:10px;z-index:5}
.kpi{width:206px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:end}
.kpi h3{grid-column:1/-1;margin:0 0 4px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:4px}
.kpi .sub{grid-column:1;font-size:11px;color:var(--muted)}
.kpi .sp{grid-column:2;grid-row:2/4;align-self:end}
.dl{display:inline-block;font:600 10.5px var(--font-ui);padding:1px 6px;border-radius:99px;margin-right:4px;font-variant-numeric:tabular-nums}
.dl.up{background:var(--ok-soft);color:var(--ok)}
.dl.dn{background:var(--crit-soft);color:var(--crit)}

.feed{position:absolute;top:132px;left:16px;width:276px;max-height:calc(100% - 132px - 176px);overflow:hidden;z-index:4}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.feedlist{display:grid}
.ev{display:grid;grid-template-columns:8px 1fr auto;gap:9px;align-items:start;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px}
.ev:last-child{border-bottom:0}
.ev i{width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--accent)}
.ev.ok i{background:var(--ok)}
.ev.warn i{background:var(--warn)}
.ev time{font:500 10.5px var(--font-mono);color:var(--muted);margin-top:2px}
.ev b{font-family:var(--font-mono);font-weight:600;font-size:11.5px}

.side{position:absolute;right:16px;bottom:16px;width:332px;max-height:calc(100% - 32px - 56px);display:flex;flex-direction:column;overflow:hidden;z-index:5}
.tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:32px;border:0;background:transparent;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12px}
.tabs button:hover{background:var(--panel-2)}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.tabs .n{font:600 10.5px var(--font-mono)}
.list{overflow:auto;min-height:0;max-height:272px}
.row{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 12px;cursor:pointer}
.row:hover{background:var(--panel-2)}
.row.on{background:var(--accent-soft)}
.row .bar{align-self:stretch;min-height:28px;border-radius:2px;background:var(--c,var(--line));box-shadow:inset 0 0 0 1px var(--line)}
.row .t{display:grid;gap:1px;min-width:0}
.row .t b{font:600 12px var(--font-mono)}
.row .t small{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:5px}
.prog i{display:block;height:100%;width:var(--w);background:var(--c2,var(--ok))}
.pill{display:inline-block;font:700 10.5px var(--font-ui);padding:3px 8px;border-radius:99px;white-space:nowrap}
.p-work{background:var(--ok-soft);color:var(--ok)}
.p-in{background:var(--accent-soft);color:var(--accent)}
.p-wait{background:var(--warn-soft);color:var(--warn)}
.p-idle{background:var(--panel-2);color:var(--muted)}
.empty{padding:20px 14px;color:var(--muted);text-align:center;font-size:12px}

.ship{position:absolute;left:16px;bottom:16px;right:380px;max-width:680px;padding:12px 16px 14px;z-index:4}
.shiphead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.shiphead small{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.shiphead b{font-size:15px;font-weight:800}
.shipmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);min-width:0}
.shipmeta .mono{color:var(--fg);font-weight:600;font-size:11.5px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.steps li{position:relative;display:grid;justify-items:center;align-content:start;gap:4px;text-align:center}
.steps li::before{content:"";position:absolute;top:7px;left:-50%;width:100%;height:2px;background:var(--line)}
.steps li:first-child::before{display:none}
.steps li.done::before,.steps li.cur::before{background:var(--accent)}
.steps i{position:relative;z-index:1;width:16px;height:16px;border-radius:50%;background:var(--panel);border:2px solid var(--line)}
.steps li.done i{background:var(--accent);border-color:var(--accent)}
.steps li.cur i{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.steps b{font-size:11px;font-weight:600;line-height:1.25}
.steps li:not(.done):not(.cur) b{color:var(--muted);font-weight:500}
.steps time{font:500 10px var(--font-mono);color:var(--muted)}

@media (max-width:1180px){
  .kpi{width:178px}
  .kpi .sp{display:none}
  .ship{right:16px;bottom:auto;display:none}
}
@media (max-width:899px){
  body{height:auto;min-height:100%;overflow:auto}
  .top{flex-wrap:wrap;position:relative}
  .brand{order:0}
  .live{order:1;margin-left:auto}
  .search{order:2;flex:1 1 100%;max-width:none;margin:0}
  .fac{order:3;position:static;flex:1 1 100%}
  .facbtn{width:100%}
  .facbtn .chev{margin-left:auto}
  .facmenu{left:16px;right:16px;top:100%;width:auto}
  .stage{flex:none;overflow:visible;display:flex;flex-direction:column;gap:12px;padding-bottom:20px}
  .view{position:relative;inset:auto;height:min(92vw,400px);min-height:280px;order:0}
  .kpis,.feed,.side,.ship{position:static;width:auto;max-width:none;max-height:none;margin-inline:16px;right:auto}
  .kpis{order:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .kpi{width:auto;padding:10px 11px}
  .kpi .v{font-size:20px}
  .kpi .sub{font-size:10.5px}
  .ship{order:2;display:block}
  .side{order:3}
  .feed{order:4}
  .list{max-height:300px}
  .steps b{font-size:10px}
}
@media (max-width:420px){
  .kpi .dl{display:none}
  .demo{display:none}
}
</style>

<header class="top">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="11" height="11" rx="3" fill="var(--accent)"/><rect x="14" y="1" width="11" height="11" rx="3" fill="var(--accent)" fill-opacity=".45"/><rect x="1" y="14" width="11" height="11" rx="3" fill="var(--accent)" fill-opacity=".45"/><rect x="14" y="14" width="11" height="11" rx="3" fill="var(--accent)" fill-opacity=".2"/></svg>
    <span>Gudang Live</span><span class="demo">Data simulasi</span>
  </div>
  <label class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Cari truk, dock, forklift, atau pengiriman" autocomplete="off" aria-label="Cari truk, dock, forklift, atau pengiriman">
  </label>
  <div class="fac">
    <button class="facbtn" id="facbtn" type="button" aria-expanded="false" aria-controls="facmenu">
      <span class="fmark" id="fcode">WH-01</span>
      <span class="fnames"><b id="fname">Gudang Contoh</b><small id="fsub">6 dock</small></span>
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="facmenu card" id="facmenu" hidden>
      <div class="fmhead"><span>Fasilitas</span><span id="fcount">6 lokasi</span></div>

  </div>
  <button class="live" id="live" type="button" aria-pressed="false" title="Klik untuk menjeda simulasi">
    <i></i><span id="livetxt">Live</span><time class="mono" id="clock">00:00:00</time>
  </button>
</header>

<main class="stage">
  <div class="view" id="view">
    <canvas id="scene" role="img" aria-label="Peta isometrik gudang dengan dock, truk, dan forklift yang bergerak"></canvas>
    <div class="ctrl">
      <button id="rot" class="txt" type="button" aria-pressed="false" title="Ganti sisi tampak gudang">Depan</button>
      <button id="tod" class="txt" type="button" title="Waktu: Auto / Siang / Sore / Malam">Auto</button>
      <button id="zin" type="button" aria-label="Perbesar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zout" type="button" aria-label="Perkecil"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button id="zreset" type="button" aria-label="Kembalikan tampilan"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    </div>
  </div>

  <section class="kpis" id="kpis" aria-label="Ringkasan"></section>

  <section class="card feed" aria-label="Aktivitas langsung">
    <div class="cardhead"><span>Aktivitas langsung</span><span id="feedloc" class="mono"></span></div>
    <div class="feedlist" id="feedlist"></div>
  </section>

  <section class="card side" aria-label="Status operasional">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="dock" aria-selected="false">Dock <span class="n" id="n-dock"></span></button>
      <button type="button" role="tab" data-tab="fork" aria-selected="false">Forklift <span class="n" id="n-fork"></span></button>
      <button type="button" role="tab" data-tab="truk" aria-selected="true">Truk <span class="n" id="n-truk"></span></button>
    </div>
    <div class="list" id="list"></div>
    <div class="empty" id="empty" hidden></div>
  </section>

  <section class="card ship" id="ship" aria-label="Lacak pengiriman"></section>
</main>

var BAYS=12, RBAYS=10, DOCK_Y=16.3, CDOCK_Y=DOCK_Y+2.9, RDOCK_Y=-17.2, RL1=33.2, RL2=-28, CL=-5.5, EXR=66.8, LANE_IN=30, LANE_OUT=26, SPAWN_X=84, EXIT_X=-36, ROAD_Y=49.9, ROAD_OUT=49.9, GATE_IN=32.5, GATE_OUT=27.5, GATE_L=25, GATE_R=35;

];
var CITIES=['Bandung','Semarang','Cirebon','Karawang','Tangerang','Surabaya','Purwakarta','Sukabumi'];
var FACS=[
  {id:'WH-01',name:'Gudang Contoh',addr:'Kawasan industri (contoh)',cap:4200,stock:3309,ot:98.2,work:8}
];
var seq=2300+Math.floor(Math.random()*40), tcount=0;

function newTruck(f){
  var p=pick(PAL), dir=Math.random()<0.58?'in':'out';
  tcount++;
  return {id:'TRK-'+(++seq),ship:'SHP-'+(70000+Math.floor(Math.random()*9999)),dir:dir,phase:'arriving',
    x:SPAWN_X,y:ROAD_Y,h:Math.PI,path:[],bay:-1,prog:0,dur:rnd(24,44),pallets:Math.round(rnd(16,32)),
    col:p.tr,cab:p.cab,city:pick(CITIES),n:tcount,si:-1,st:[],gone:false};
}
function stepIdx(t){
  var p=t.phase;
  if(t.dir==='in'){ if(p==='arriving'||p==='queued'||p==='approach')return 3; if(p==='docking'||p==='working')return 4; return 5; }
  if(p==='arriving'||p==='queued'||p==='approach')return 2; if(p==='docking'||p==='working')return 3; return 4;
}
function setStep(t){
  var i=stepIdx(t); if(i===t.si)return;
  var now=Date.now();
  for(var k=0;k<=i;k++){ if(!t.st[k]) t.st[k]=k<i?now-(i-k)*rnd(20,60)*60000:now; }
  t.st[i]=now; t.si=i;
}
function mkFac(d){
  var f={id:d.id,name:d.name,addr:d.addr,cap:d.cap,stock:d.stock,base:d.stock,ot:d.ot,
    bays:[],rb:[],rwait:[],trucks:[],queue:[],feed:[],spawnT:rnd(3,7),samp:3,done:0,sel:null,
    fk:[],hStock:[],hTruck:[],hOt:[]};
  for(var i=0;i<BAYS;i++){ f.bays.push(null); f.fk.push({x:bayX(i)+1.8,y:17,h:Math.PI/2,carry:false,dir:1}); }
  for(var j=0;j<RBAYS;j++){ f.rb.push(null); f.rwait.push(rnd(2,14)); }
  var order=[]; for(var oi=0;oi<BAYS;oi++)order.push(oi);
  order=order.sort(function(){return Math.random()-.5}).slice(0,d.work).sort(function(a,b){return a-b});
  if(d.id==='WH-01') order=[0,1,3,4,6,8,9,11];
  order.forEach(function(b){
    var t=newTruck(f); t.phase='working'; t.bay=b; t.x=bayX(b); t.y=CDOCK_Y; t.h=Math.PI/2;
    t.prog=rnd(.08,.85); setStep(t); f.bays[b]=t; f.trucks.push(t);
  });
  var fb=f.bays.indexOf(null);
  if(fb>=0){
    var a=newTruck(f); a.phase='approach'; a.bay=fb; f.bays[fb]=a; a.y=LANE_IN; a.x=bayX(fb)-(bayX(fb)>=GATE_IN?1:-1)*rnd(10,16); a.h=bayX(fb)>=GATE_IN?0:Math.PI; toApproach(a,fb); setStep(a); f.trucks.push(a);
  }
  var sel=f.trucks.filter(function(t){return t.phase==='working'})[0]; f.sel=sel?sel.id:null;
  var rord=[]; for(var ri=0;ri<RBAYS;ri++)rord.push(ri);
  rord.sort(function(){return Math.random()-.5}).slice(0,Math.max(2,Math.round(d.work*.6))).forEach(function(b){spawnRear(f,b,true)});
  for(var i2=0;i2<24;i2++){
    f.hStock.push(f.stock*(1-(23-i2)*0.0007+(Math.random()-.5)*0.004));
    f.hTruck.push(Math.max(2,f.trucks.length+Math.round((Math.random()-.5)*3)));
    f.hOt.push(f.ot+(Math.random()-.5)*0.8);
  }
  f.hTruck[23]=f.trucks.length; f.hStock[23]=f.stock; f.hOt[23]=f.ot;
  ev(f,'ok','Sistem terhubung ke <b>'+f.id+'</b>');
  return f;
}
function ev(f,kind,html){ f.feed.unshift({t:Date.now(),k:kind,h:html}); if(f.feed.length>30)f.feed.pop(); }
function freeBay(f){return f.bays.indexOf(null)}
function stLabel(t){
  switch(t.phase){
    case 'arriving': case 'approach': return 'Masuk';
    case 'queued': return 'Antre';
    case 'docking': return 'Merapat';
    case 'working': return t.dir==='in'?'Bongkar':'Muat';
    default: return 'Keluar';
  }
}
function stClass(t){
  return t.phase==='working'?'p-work':(t.phase==='queued'?'p-wait':(t.phase==='leaving'?'p-idle':'p-in'));
}
/* ---- gerak truk: jalur melengkung, percepatan halus, jarak aman, trailer mengikuti kabin ---- */
function sampleRoute(pts,r){
  var out=[pts[0]], i, k, u;
  for(i=1;i<pts.length-1;i++){
    var a=pts[i-1], b=pts[i], c=pts[i+1];
    var v1=[a[0]-b[0],a[1]-b[1]], v2=[c[0]-b[0],c[1]-b[1]];
    var l1=Math.hypot(v1[0],v1[1]), l2=Math.hypot(v2[0],v2[1]);
    var rr=Math.min(r,l1*.5,l2*.5);
    var p1=[b[0]+v1[0]/l1*rr,b[1]+v1[1]/l1*rr], p2=[b[0]+v2[0]/l2*rr,b[1]+v2[1]/l2*rr];
    out.push(p1);
    for(k=1;k<10;k++){ u=k/10;
      out.push([(1-u)*(1-u)*p1[0]+2*(1-u)*u*b[0]+u*u*p2[0],(1-u)*(1-u)*p1[1]+2*(1-u)*u*b[1]+u*u*p2[1]]);
    }
    out.push(p2);
  }
  out.push(pts[pts.length-1]);
  return out;
}
function bez(p0,p1,p2,p3,n){
  var o=[], i, u, a, b, c, d;
  for(i=0;i<=n;i++){ u=i/n; a=(1-u)*(1-u)*(1-u); b=3*(1-u)*(1-u)*u; c=3*(1-u)*u*u; d=u*u*u;
    o.push([a*p0[0]+b*p1[0]+c*p2[0]+d*p3[0],a*p0[1]+b*p1[1]+c*p2[1]+d*p3[1]]); }
  return o;
}
function cleanPts(p){
  var o=[p[0]];
  for(var i=1;i<p.length;i++){ var q=o[o.length-1]; if(Math.hypot(p[i][0]-q[0],p[i][1]-q[1])>.05) o.push(p[i]); }
  return o;
}
function mkRoute(p,rev){
  var d=[0], i;
  for(i=1;i<p.length;i++) d.push(d[i-1]+Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]));
  return {p:p,d:d,len:d[d.length-1],rev:!!rev};
}
function setRoute(t,pts,r,rev){
  var c=cleanPts(pts); if(c.length<2) c.push([c[0][0]+.01,c[0][1]]);
  t.rt=mkRoute(r?sampleRoute(c,r):c,rev); t.s=0; if(rev) t.v=0;
}
function segIdx(rt,s){ var d=rt.d, lo=0, hi=d.length-2; while(lo<hi){ var m=(lo+hi+1)>>1; if(d[m]<=s)lo=m; else hi=m-1; } return lo; }
function tang(rt,s){ var i=segIdx(rt,s), p=rt.p; return Math.atan2(p[i+1][1]-p[i][1],p[i+1][0]-p[i][0]); }
function place(t,dt){
  var rt=t.rt, i=segIdx(rt,t.s), p=rt.p, d=rt.d, u=(t.s-d[i])/Math.max(1e-6,d[i+1]-d[i]);
  t.x=p[i][0]+(p[i+1][0]-p[i][0])*u; t.y=p[i][1]+(p[i+1][1]-p[i][1])*u;
  var h=Math.atan2(p[i+1][1]-p[i][1],p[i+1][0]-p[i][0])+(rt.rev?Math.PI:0);
  t.h+=angDiff(h,t.h)*Math.min(1,dt*9);
}
function routePose(rt,sv){
  var i=segIdx(rt,sv), p=rt.p, d=rt.d, u=(sv-d[i])/Math.max(1e-6,d[i+1]-d[i]);
  return [p[i][0]+(p[i+1][0]-p[i][0])*u, p[i][1]+(p[i+1][1]-p[i][1])*u, Math.atan2(p[i+1][1]-p[i][1],p[i+1][0]-p[i][0])+(rt.rev?Math.PI:0)];
}
function bodyPts(x,y,h){ var c=Math.cos(h)*2.2, s2=Math.sin(h)*2.2; return [[x-c,y-s2],[x,y],[x+c,y+s2]]; }
/* jarak sepanjang rute sampai potensi tabrakan pertama (Infinity bila aman); posisi truk lain diprediksi menurut waktu */
function poseAt(o,tau){
  if(o.phase==='working'||!o.rt||(o.v||0)<.3) return [o.x,o.y,o.h];
  var sv=Math.min(o.rt.len,o.s+o.v*tau+.3*tau*tau);
  return routePose(o.rt,sv);
}
function travelT(D,v){ var a=2.2, vm=4.8, da=(vm*vm-v*v)/(2*a); if(D<=da) return (Math.sqrt(v*v+2*a*D)-v)/a; return (vm-v)/a+(D-da)/vm; }
function gapAhead(f,t){
  var rt=t.rt; if(!rt||t.ig>0) return Infinity;
  var v=t.v||0, La=Math.min(rt.len-t.s, 5+v*3.4);
  if(La<.3) return Infinity;
  var m=t.h+(rt.rev?Math.PI:0), mx=Math.cos(m), my=Math.sin(m), ve=Math.max(v,1.6), best=Infinity, yl=false, i, o, k, j, own=[];
  for(var dd=.5; dd<=La+.01; dd+=.9){ var ps=routePose(rt,t.s+dd); own.push([dd,ps[0],ps[1],ps[2]]); }
  for(i=0;i<f.trucks.length;i++){
    o=f.trucks[i]; if(o===t||o.gone) continue;
    var rx=o.x-t.x, ry=o.y-t.y; if(rx*rx+ry*ry>(La+22)*(La+22)) continue;
    var al=rx*mx+ry*my; if(al<-1.2) continue;
    var stat=o.phase==='working'||!o.rt, mo=o.h+(o.rt&&o.rt.rev?Math.PI:0), ov=o.v||0;
    var follow=!stat&&al>0&&Math.cos(mo-m)>.3, ybody=stat||follow;
    if(!ybody){
      var e1=Math.min(o.rt.len,o.s+18), cd=-1, ce=0;
      outer: for(k=0;k<own.length;k++){
        for(var ee=o.s; ee<=e1+.01; ee+=1.2){
          var pp=routePose(o.rt,ee), cx=own[k][1]-pp[0], cy=own[k][2]-pp[1];
          if(cx*cx+cy*cy<10.9){ cd=own[k][0]; ce=ee-o.s; break outer; }
        }
      }
      if(cd<0) continue;
      var tt=travelT(cd,v), to=travelT(ce,ov), bias=t.yw?-1.1:.4;
      if(tt>to+bias||(Math.abs(tt-to)<=.4&&t.n>o.n)){ best=Math.min(best,Math.max(.3,cd-1.2)); yl=true; }
      continue;
    }
    for(k=0;k<own.length&&own[k][0]<best;k++){
      var q=bodyPts.apply(null,poseAt(o,own[k][0]/ve)), mine=bodyPts(own[k][1],own[k][2],own[k][3]);
      for(var a2=0;a2<3;a2++) for(j=0;j<3;j++){
        var ex=mine[a2][0]-q[j][0], ey=mine[a2][1]-q[j][1];
        if(ex*ex+ey*ey<3.8){ best=Math.min(best,own[k][0]); k=1e9; a2=9; break; }
      }
    }
  }
  t.yw=yl;
  return best;
}
function drive(f,t,dt,vmax){
  var rt=t.rt; if(!rt) return true;
  var rem=rt.len-t.s, v=vmax;
  v=Math.min(v,Math.sqrt(2*2.4*Math.max(rem,0))+.25);
  if(!rt.rev){
    var d=Math.abs(angDiff(tang(rt,Math.min(rt.len-.01,t.s+4)),tang(rt,t.s)));
    if(d>.35) v=Math.min(v,2.6);
  }
  var gp=gapAhead(f,t);
  if(gp<Infinity) v=Math.min(v,Math.sqrt(2*3*Math.max(gp-1.3,0)));
  if(gp<Infinity&&(t.v||0)<.15){ t.blk=(t.blk||0)+dt; if(t.blk>7){ t.ig=3; t.blk=0; } } else t.blk=0;
  if(t.ig>0) t.ig-=dt;
  t.v=(t.v||0)+clamp(v-(t.v||0),-4*dt,2.2*dt);
  t.s=Math.min(rt.len,t.s+t.v*dt);
  place(t,dt);
  if(t.th==null) t.th=t.h;
  if(rt.rev) t.th=t.h;
  else{ var dth=angDiff(t.h,t.th); t.th+=(t.v/2.15*Math.sin(dth)+(t.v<.3?dth*1.5:0))*dt; }
  return rt.len-t.s<.06;
}
function approachPts(t,b){
  var bx=bayX(b), sg=bx>=GATE_IN?1:-1, pts=[[t.x,t.y]];
  t.sg=sg;
  if(t.y>LANE_IN+2){ pts.push([GATE_IN,ROAD_Y]); pts.push([GATE_IN,LANE_IN]); }
  pts.push([bx+sg*6.5,LANE_IN]);
  return pts;
}
function corridorFree(f,t,rt,span){
  var L=Math.min(rt.len,span), own=[], i, k, j, a2, d;
  for(d=0; d<=L+.01; d+=1.2) own.push(routePose(rt,d));
  for(i=0;i<f.trucks.length;i++){
    var o=f.trucks[i]; if(o===t||o.gone) continue;
    var op=bodyPts(o.x,o.y,o.h), rp=[];
    if(o.phase!=='working'&&o.rt&&(o.phase==='leaving'||o.phase==='approach'||o.phase==='docking'||(o.v||0)>.3)){
      var e1=Math.min(o.rt.len,o.s+13);
      for(var ee=o.s; ee<=e1+.01; ee+=1.5){ var pp=routePose(o.rt,ee); rp.push([pp[0],pp[1]]); }
    }
    for(k=0;k<own.length;k++){
      var mine=bodyPts(own[k][0],own[k][1],own[k][2]);
      for(a2=0;a2<3;a2++) for(j=0;j<3;j++){ var ex=mine[a2][0]-op[j][0], ey=mine[a2][1]-op[j][1]; if(ex*ex+ey*ey<3.8) return false; }
      for(j=0;j<rp.length;j++){ var cx=own[k][0]-rp[j][0], cy=own[k][1]-rp[j][1]; if(cx*cx+cy*cy<11.6) return false; }
    }
  }
  return true;
}
/* persimpangan gerbang: aliran keluar (x=GATE_OUT) memotong jalur masuk ke dock kiri dan jalur truk belakang */
function crossActive(f,self){
  return f.trucks.some(function(o){ return o!==self&&!o.gone&&o.phase==='approach'&&(o.rear||o.sg===-1)&&o.x>20&&o.x<46&&o.y>24; });
}
function exitActive(f,self){
  return f.trucks.some(function(o){ return o!==self&&!o.gone&&o.phase==='leaving'&&o.y>20&&o.y<40&&o.x>18&&o.x<38; });
}
function tryApproach(f,t,b){
  var sgb=bayX(b)>=GATE_IN?1:-1;
  if(f.trucks.some(function(o){return o!==t&&!o.gone&&!o.rear&&(o.phase==='approach'||o.phase==='docking')&&o.sg===sgb})) return false;
  if(sgb===-1&&exitActive(f,t)) return false;
  var rt=mkRoute(sampleRoute(cleanPts(approachPts(t,b)),4.5));
  if(!corridorFree(f,t,rt,24)) return false;
  t.phase='approach'; t.rt=rt; t.s=0; return true;
}
function toApproach(t,b){ t.phase='approach'; setRoute(t,approachPts(t,b),4.5,false); }
function toDock(f,t){
  var bx=bayX(t.bay), sg=t.sg||1, p0=[t.x,t.y];
  var rt=mkRoute(bez(p0,[p0[0]-sg*3.5,p0[1]],[bx,CDOCK_Y+5.5],[bx,CDOCK_Y],30),true);
  if(!corridorFree(f,t,rt,16)) return false;
  t.phase='docking'; t.rt=rt; t.s=0; t.v=0; t.th=t.h; return true;
}
function laneBusy(f,t){ return f.trucks.some(function(o){return o!==t&&!o.gone&&o.phase==='leaving'&&o.y<33&&o.y>17&&o.x>5&&o.x<56}); }
function toLeave(f,t){
  if(crossActive(f,t)||laneBusy(f,t)) return false;
  var bx=bayX(t.bay);
  var rt=mkRoute(sampleRoute(cleanPts([[bx,CDOCK_Y],[bx,LANE_OUT],[GATE_OUT,LANE_OUT],[GATE_OUT,ROAD_Y],[EXIT_X,ROAD_Y]]),3.8));
  if(!corridorFree(f,t,rt,26)) return false;
  t.phase='leaving'; t.v=0; t.rt=rt; t.s=0; return true;
}
function toSlot(t,k){ t.phase='arriving'; setRoute(t,[[t.x,t.y],[slotX(k),ROAD_Y]],0,false); }
function spawn(f){
  var t=newTruck(f), b=freeBay(f);
  if(!f.queue.length&&b>=0&&tryApproach(f,t,b)){
    f.bays[b]=t; t.bay=b;
  }else{
    f.queue.push(t); toSlot(t,f.queue.length-1);
  }
  setStep(t); f.trucks.push(t);
  ev(f,'in','<b>'+t.id+'</b> tiba di gerbang depan ('+(t.dir==='in'?'bongkar':'muat')+')');
}
function assignQueue(f){
  while(f.queue.length){
    var b=freeBay(f); if(b<0)break;
    var t=f.queue[0]; if(!tryApproach(f,t,b)) break;
    f.queue.shift(); f.bays[b]=t; t.bay=b;
    f.queue.forEach(function(q,k){ toSlot(q,k); });
  }
}
function updTruck(f,t,dt){
  if(t.rear){ if(t.phase==='leaving'){ if(drive(f,t,dt,4.8)) t.gone=true; setStep(t); } return; }
  switch(t.phase){
    case 'arriving': if(drive(f,t,dt,5.4)) t.phase='queued'; break;
    case 'queued': drive(f,t,dt,5.4); break;
    case 'approach': if(drive(f,t,dt,5.2)){ if(toDock(f,t)) ev(f,'in','<b>'+t.id+'</b> merapat ke '+dn(t)); } break;
    case 'docking': if(drive(f,t,dt,1.9)){ t.phase='working'; t.prog=0; t.v=0; ev(f,'ok',(t.dir==='in'?'Bongkar':'Muat')+' dimulai di '+dn(t)+' · <b>'+t.id+'</b> · '+t.pallets+' palet'); } break;
    case 'working':
      t.prog+=dt/t.dur;
      f.stock=clamp(f.stock+(t.dir==='in'?1:-1)*t.pallets*dt/t.dur,f.cap*.4,f.cap*.95);
      if(t.prog>=1){
        t.prog=1; if(!toLeave(f,t)) break;
        f.bays[t.bay]=null; f.done++;
        var late=Math.random()<0.04; f.ot=clamp(f.ot+(late?-0.14:0.012),95.5,99.4);
        ev(f,late?'warn':'ok','<b>'+t.id+'</b> selesai · '+dn(t)+' kosong'+(late?' · terlambat':''));
      } break;
    default: if(drive(f,t,dt,4.8)) t.gone=true;
  }
  setStep(t);
}
function updFac(f,dt){
  f.spawnT-=dt;
  if(f.spawnT<=0){ f.spawnT=rnd(6,12); if(f.trucks.length<22&&f.queue.length<2&&spawnClear(f)) spawn(f); }
  assignQueue(f);
  updRear(f,dt);
  f.trucks.forEach(function(t){updTruck(f,t,dt)});
  f.trucks=f.trucks.filter(function(t){return !t.gone});
  if(f.sel&&!f.trucks.some(function(t){return t.id===f.sel})){
    var n=f.trucks.filter(function(t){return t.phase==='working'})[0]||f.trucks[0]; f.sel=n?n.id:null;
  }
  f.fk.forEach(function(k,i){
    var t=f.bays[i], act=t&&t.phase==='working', ty=act?(k.dir>0?20.2:17.4):17;
    var dy=ty-k.y, sp=5*dt;
    if(Math.abs(dy)>sp){ k.y+=Math.sign(dy)*sp; k.h=dy>0?Math.PI/2:-Math.PI/2; }
    else{ k.y=ty; if(act) k.dir=-k.dir; }
    k.carry=!!act&&(t.dir==='in'?dy>0:dy<0);
  });
  f.samp-=dt;
  if(f.samp<=0){
    f.samp=3;
    f.hStock.push(f.stock); f.hStock.shift();
    f.hTruck.push(f.trucks.length); f.hTruck.shift();
    f.hOt.push(f.ot); f.hOt.shift();
  }
}

function rearSide(t){ return !!t.rear&&(t.phase==='docking'||t.phase==='working'||t.y<-12); }
function dn(t){return t.rear?'Dock B'+(t.rb+1):(t.bay>=0?'Dock D'+(BAYS-t.bay):'Gerbang')}
function spawnClear(f){ return !f.trucks.some(function(t){return t.x>SPAWN_X-9&&t.y>ROAD_Y-2}); }
function rearOnPath(t){ return !!t.rear&&(t.phase==='arriving'||t.phase==='approach'||t.phase==='docking'||t.phase==='leaving'); }
function rearPts(i){ var bx=rbayX(i); return [[SPAWN_X,ROAD_Y],[GATE_IN,ROAD_Y],[GATE_IN,RL1],[CL,RL1],[CL,RL2],[bx+6.5,RL2]]; }
function toRearDock(f,t){
  var bx=rbayX(t.rb), p0=[t.x,t.y];
  var rt=mkRoute(bez(p0,[p0[0]-3.5,p0[1]],[bx,RDOCK_Y-5.5],[bx,RDOCK_Y],30),true);
  if(!corridorFree(f,t,rt,16)) return false;
  t.phase='docking'; t.rt=rt; t.s=0; t.v=0; t.th=t.h; return true;
}
function toRearLeave(f,t){

    var t=F.bays[i], act=t&&t.phase==='working', hay='flt-'+(i<9?'0':'')+(i+1)+' forklift '+(act?stLabel(t)+' '+t.id:'standby');
    if(!match(hay))return;
    out.push({k:'f'+i,t:act?t.id:'',cls:'row'+(act&&t.id===F.sel?' on':''),
      html:'<span class="bar" style="--c:'+(act?'#e9b020':'var(--line)')+'"></span><span class="t"><b>FLT-'+(i<9?'0':'')+(i+1)+'</b><small>'+(act?'Dock D'+(BAYS-i)+' · '+t.id+(k.carry?' · membawa palet':''):'Parkir dekat Dock D'+(BAYS-i))+'</small></span><span class="pill '+(act?'p-work':'p-idle')+'">'+(act?stLabel(t):'Standby')+'</span>'});
  });
  return out;
}
function setTab(n){
  tab=n;
  document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===n?'true':'false')});
}
document.querySelectorAll('.tabs button').forEach(function(b){b.addEventListener('click',function(){setTab(b.dataset.tab);ui(true)})});
listEl.addEventListener('click',function(e){
  var b=e.target.closest('button[data-t]'); if(!b)return;
  if(b.dataset.t){F.sel=b.dataset.t;focusSel();ui(true)}
});
var hold=false;
['pointerdown'].forEach(function(n){document.querySelector('.side').addEventListener(n,function(){hold=true})});
['pointerup','pointercancel'].forEach(function(n){window.addEventListener(n,function(){hold=false})});

var STEPS_IN=['Dikonfirmasi','Diambil','Dimuat','Dalam perjalanan','Bongkar','Selesai'];
var STEPS_OUT=['Dikonfirmasi','Picking','Antre dock','Muat','Segel & jalan','Selesai'];
function shipHTML(){
  var t=F.trucks.filter(function(x){return x.id===F.sel})[0];
  if(!t) return '<div class="empty">Pilih truk di peta atau di daftar untuk melacak pengiriman.</div>';
  var steps=t.dir==='in'?STEPS_IN:STEPS_OUT, li='';
  steps.forEach(function(s,i){
    var cls=i<t.si?'done':(i===t.si?'cur':''), tm=t.st[i]&&i<=t.si?tfm.format(new Date(t.st[i])):'–';
    li+='<li class="'+cls+'"><i></i><b>'+s+'</b><time>'+tm+'</time></li>';
  });
  var route=t.dir==='in'?t.city+' → '+F.name:F.name+' → '+t.city;
  return '<div class="shiphead"><div><small>Lacak pengiriman</small><b>#'+t.ship+'</b></div>'+
    '<div class="shipmeta"><span class="mono">'+t.id+'</span><span>'+dn(t)+'</span><span>'+esc(route)+'</span><span class="pill '+stClass(t)+'">'+stLabel(t)+'</span></div></div>'+
    '<ol class="steps">'+li+'</ol>';
}
var lastUI=0, fmOpen=false;
function ui(force){
  var now=performance.now(); if(!force&&now-lastUI<250)return; if(hold&&!force)return; lastUI=now;
  var f=F, onsite=f.trucks.length;
  var inb=f.trucks.filter(function(t){return t.dir==='in'}).length, outb=onsite-inb;
  var util=Math.round(f.stock/f.cap*100), busy=f.bays.filter(Boolean).length+f.rb.filter(Boolean).length;
  $('#fcode').textContent=f.id; $('#fname').textContent=f.name;
  $('#fsub').textContent=busy+'/'+(BAYS+RBAYS)+' dock terpakai · '+util+'% kapasitas';
  $('#feedloc').textContent=f.id;
  var sd=1.8+(f.stock-f.base)/f.base*100, od=0.4+(f.ot-f.hOt[0]);
  setHTML(kpisEl,
    '<article class="card kpi"><h3>Stok di tangan</h3><div class="v">'+NF.format(Math.round(f.stock))+'<small>palet</small></div><div class="sub">'+dl(sd)+f.id+'</div><div class="sp">'+spark(f.hStock)+'</div></article>'+
    '<article class="card kpi"><h3>Truk di lokasi</h3><div class="v">'+onsite+'</div><div class="sub">'+inb+' inbound · '+outb+' outbound</div><div class="sp">'+spark(f.hTruck)+'</div></article>'+
    '<article class="card kpi"><h3>Tepat waktu</h3><div class="v">'+pf(f.ot,1)+'<small>%</small></div><div class="sub">'+dl(od)+'30 hari</div><div class="sp">'+spark(f.hOt)+'</div></article>');
  var fh='';
  f.feed.slice(0,7).forEach(function(e){fh+='<div class="ev '+e.k+'"><i></i><span>'+e.h+'</span><time>'+tfs.format(new Date(e.t))+'</time></div>'});
  setHTML(feedEl,fh);
  var rows=tab==='dock'?dockRows():(tab==='fork'?forkRows():trukRows());
  sync(listEl,rows);
  if(!rows.length){emptyEl.hidden=false;emptyEl.textContent=query?'Tidak ada hasil untuk “'+query+'”.':'Belum ada data.'}else emptyEl.hidden=true;
  $('#n-dock').textContent=busy+'/'+(BAYS+RBAYS);
  $('#n-fork').textContent=f.fk.filter(function(k,i){return f.bays[i]&&f.bays[i].phase==='working'}).length+'/'+BAYS;
  $('#n-truk').textContent=onsite;
  setHTML(shipEl,shipHTML());
  if(fmOpen||force)renderMenu();
}
function renderMenu(){
  var items=FS.map(function(x){
    var u=Math.round(x.stock/x.cap*100), b=x.bays.filter(Boolean).length+x.rb.filter(Boolean).length;
    return {k:x.id,t:'',cls:'fm'+(x===F?' on':''),
      html:'<span class="fc">'+x.id+'</span><span class="fi"><b>'+esc(x.name)+'</b><small>'+esc(x.addr)+'</small><small>'+x.trucks.length+' truk · '+b+'/'+(BAYS+RBAYS)+' dock</small></span><span class="fu'+(u>=90?' hi':'')+'"><span>'+u+'%</span><i style="--w:'+u+'%"></i></span>'};
  });
  sync($('#fmlist'),items);
}
var fb=$('#facbtn'), fm=$('#facmenu');
function toggleMenu(open){
  fmOpen=open; fm.hidden=!open; fb.setAttribute('aria-expanded',open?'true':'false'); if(open)renderMenu();
}
if(FS.length<2){ fb.disabled=true; fb.style.cursor='default'; var chv=fb.querySelector('.chev'); if(chv)chv.style.display='none'; }
fb.addEventListener('click',function(e){e.stopPropagation(); if(FS.length>1)toggleMenu(fm.hidden)});
$('#fmlist').addEventListener('click',function(e){
  var b=e.target.closest('button[data-k]'); if(!b)return;
  var n=FS.filter(function(x){return x.id===b.dataset.k})[0];
  if(n){F=n;toggleMenu(false);ui(true)}
});
document.addEventListener('click',function(e){ if(fmOpen&&!fm.contains(e.target))toggleMenu(false) });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&fmOpen){toggleMenu(false);fb.focus()} });

var qi=$('#q');
qi.addEventListener('input',function(){query=qi.value.trim().toLowerCase();ui(true)});
qi.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var t=F.trucks.filter(function(x){return match([x.id,x.ship,x.city].join(' '))})[0];
  if(t&&query){F.sel=t.id;focusSel();setTab('truk');ui(true)}
});
$('#live').addEventListener('click',function(){
  paused=!paused; this.setAttribute('aria-pressed',paused?'true':'false'); $('#livetxt').textContent=paused?'Jeda':'Live';
});

/* ---------- Loop ---------- */
var last=performance.now(), clockT=0;
function frame(now){
  var dt=Math.min(.1,(now-last)/1000); last=now;
  if(!paused){ FS.forEach(function(f){updFac(f,dt)}); updWk(dt); updSc(dt); CLK+=dt; if(tod.mode==='auto') tod.t=(tod.t+dt/180)%1; }
  if(tod.mode!=='auto') tod.t=TODT[tod.mode];
  render(); ui(false);
  clockT-=dt; if(clockT<=0){clockT=.5;$('#clock').textContent=tfs.format(new Date());}
  requestAnimationFrame(frame);
}
setInterval(function(){T=null},2000);
$('#clock').textContent=tfs.format(new Date());
ui(true);
requestAnimationFrame(frame);
})();
</script>
</body></html>
